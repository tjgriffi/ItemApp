name: Pull request

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group:  ${{ github.token }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1'

      - name: Xcode Version
        run: xcodebuild -version

      - name: Available Simulators
        run: xcrun simctl list devices available

      - name: List Project Schemes
        run: xcodebuild -list -project ItemApp.xcodeproj
        
      - name: Build App First
        run: xcodebuild build
          -project ItemApp.xcodeproj
          -scheme ItemApp
          -sdk iphonesimulator
          -destination 'platform=iOS Simulator,name=iPhone 16'
          CODE_SIGN_IDENTITY=""
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO

      - uses: ruby/setup-ruby@v1

      - name: Install Bundler
        run: gem install bundler

      - name: Install gems
        run: bundle install

      - name: Swift Packages Cache
        uses: actions/cache@v4
        id: cache
        with:
          path: |
            Build/SourcePackages
            Build/Build/Products
          key: ${{ runner.os }}-deps-v1-${{ hashFiles('ItemApp.xcodeproj/project.workspace/xcshareddata/swiftpm/Package.resolved')}}
          restore-keys: ${{ runner.os }}-deps-v1
          
      - name: Run Tests (No Cache)
        if: steps.cache.outputs.cache-hit != 'true'
        run: bundle exec fastlane unit_test

      - name: Run Tests (Cache)
        if: steps.cache.outputs.cache-hit == 'true'
        run: bundle exec fastlane unit_test skip_package_dependencies_resolution:true